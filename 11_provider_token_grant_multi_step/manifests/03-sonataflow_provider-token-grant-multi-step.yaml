apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  annotations:
    sonataflow.org/description: Experimental call-time provider-token retrieval. Each
      custom operation asks the RHDH secure-token-storage broker for a current GitHub
      token immediately before making one read-only GitHub API request. The token
      never enters workflow state.
    sonataflow.org/expressionLang: jq
    sonataflow.org/profile: gitops
    sonataflow.org/version: 0.1.0
  creationTimestamp: null
  labels:
    app: provider-token-grant-multi-step
    app.kubernetes.io/component: serverless-workflow
    app.kubernetes.io/instance: provider-token-grant-multi-step
    app.kubernetes.io/managed-by: sonataflow-operator
    app.kubernetes.io/name: provider-token-grant-multi-step
    app.kubernetes.io/version: main
    sonataflow.org/workflow-app: provider-token-grant-multi-step
    sonataflow.org/workflow-namespace: ""
  name: provider-token-grant-multi-step
spec:
  flow:
    annotations:
    - workflow-type/experimental
    dataInputSchema:
      failOnValidationErrors: true
      schema: schemas/provider-token-grant-multi-step__main-schema.json
    functions:
    - name: getProviderProfile
      operation: service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::getGithubProfile
      type: custom
    - name: listPrivateRepositories
      operation: service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubPrivateRepositories
      type: custom
    - name: listOrganizations
      operation: service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubOrganizations
      type: custom
    - name: listStarredRepositories
      operation: service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubStarredRepositories
      type: custom
    start:
      stateName: GetProviderProfile
    states:
    - actionMode: sequential
      actions:
      - actionDataFilter:
          toStateData: .profile
          useResults: true
        functionRef:
          arguments:
            grantId: ${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github"
              }
            provider: ${ .provider // "github" }
          invoke: sync
          refName: getProviderProfile
        name: callProvider
      name: GetProviderProfile
      transition:
        nextState: ListPrivateRepositories
      type: operation
    - actionMode: sequential
      actions:
      - actionDataFilter:
          toStateData: .privateRepositories
          useResults: true
        functionRef:
          arguments:
            grantId: ${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github"
              }
            page: ${ .page // 1 }
            perPage: ${ .perPage // 100 }
            provider: ${ .provider // "github" }
          invoke: sync
          refName: listPrivateRepositories
        name: callProvider
      name: ListPrivateRepositories
      transition:
        nextState: ListOrganizations
      type: operation
    - actionMode: sequential
      actions:
      - actionDataFilter:
          toStateData: .organizations
          useResults: true
        functionRef:
          arguments:
            grantId: ${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github"
              }
            page: ${ .page // 1 }
            perPage: ${ .perPage // 100 }
            provider: ${ .provider // "github" }
          invoke: sync
          refName: listOrganizations
        name: callProvider
      name: ListOrganizations
      transition:
        nextState: ListStarredRepositories
      type: operation
    - actionMode: sequential
      actions:
      - actionDataFilter:
          toStateData: .starredRepositories
          useResults: true
        functionRef:
          arguments:
            grantId: ${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github"
              }
            page: ${ .page // 1 }
            perPage: ${ .perPage // 100 }
            provider: ${ .provider // "github" }
          invoke: sync
          refName: listStarredRepositories
        name: callProvider
      end:
        terminate: true
      name: ListStarredRepositories
      type: operation
  podTemplate:
    container:
      image: quay.io/orchestrator/demo-provider-token-grant-multi-step:latest
      resources: {}
  resources:
    configMaps:
    - configMap:
        name: 01-provider-token-grant-multi-step-resources-schemas
      workflowPath: schemas
status:
  address: {}
  lastTimeRecoverAttempt: null
