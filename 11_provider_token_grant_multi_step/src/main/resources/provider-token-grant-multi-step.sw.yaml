specVersion: "0.8"
id: provider-token-grant-multi-step
name: Provider Token Grant Multi-Step Consumer
description: >-
  Experimental call-time provider-token retrieval. Each custom operation asks
  the RHDH secure-token-storage broker for a current GitHub token immediately
  before making one read-only GitHub API request. The token never enters
  workflow state.
annotations:
  - "workflow-type/experimental"
version: 0.1.0
start: GetProviderProfile
dataInputSchema: schemas/provider-token-grant-multi-step__main-schema.json
functions:
  - name: getProviderProfile
    type: custom
    operation: >-
      service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::getGithubProfile
  - name: listPrivateRepositories
    type: custom
    operation: >-
      service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubPrivateRepositories
  - name: listOrganizations
    type: custom
    operation: >-
      service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubOrganizations
  - name: listStarredRepositories
    type: custom
    operation: >-
      service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::listGithubStarredRepositories
states:
  - name: GetProviderProfile
    type: operation
    actions:
      - name: callProvider
        functionRef:
          refName: getProviderProfile
          arguments:
            grantId: '${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github" }'
            provider: '${ .provider // "github" }'
        actionDataFilter:
          toStateData: .profile
    transition: ListPrivateRepositories

  - name: ListPrivateRepositories
    type: operation
    actions:
      - name: callProvider
        functionRef:
          refName: listPrivateRepositories
          arguments:
            grantId: '${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github" }'
            provider: '${ .provider // "github" }'
            page: '${ .page // 1 }'
            perPage: '${ .perPage // 100 }'
        actionDataFilter:
          toStateData: .privateRepositories
    transition: ListOrganizations

  - name: ListOrganizations
    type: operation
    actions:
      - name: callProvider
        functionRef:
          refName: listOrganizations
          arguments:
            grantId: '${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github" }'
            provider: '${ .provider // "github" }'
            page: '${ .page // 1 }'
            perPage: '${ .perPage // 100 }'
        actionDataFilter:
          toStateData: .organizations
    transition: ListStarredRepositories

  - name: ListStarredRepositories
    type: operation
    actions:
      - name: callProvider
        functionRef:
          refName: listStarredRepositories
          arguments:
            grantId: '${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github" }'
            provider: '${ .provider // "github" }'
            page: '${ .page // 1 }'
            perPage: '${ .perPage // 100 }'
        actionDataFilter:
          toStateData: .starredRepositories
    end: true
