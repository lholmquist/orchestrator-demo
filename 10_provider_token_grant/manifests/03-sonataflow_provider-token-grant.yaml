apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  annotations:
    sonataflow.org/description: Experimental call-time provider-token retrieval. The
      workflow passes an opaque grant reference to a custom operation; the operation
      retrieves a short-lived token and uses it immediately for a provider API call.
    sonataflow.org/expressionLang: jq
    sonataflow.org/profile: gitops
    sonataflow.org/version: 0.1.0
  creationTimestamp: null
  labels:
    app: provider-token-grant
    app.kubernetes.io/component: serverless-workflow
    app.kubernetes.io/instance: provider-token-grant
    app.kubernetes.io/managed-by: sonataflow-operator
    app.kubernetes.io/name: provider-token-grant
    app.kubernetes.io/version: main
    sonataflow.org/workflow-app: provider-token-grant
    sonataflow.org/workflow-namespace: ""
  name: provider-token-grant
spec:
  flow:
    annotations:
    - workflow-type/experimental
    dataInputSchema:
      failOnValidationErrors: true
      schema: schemas/provider-token-grant__main-schema.json
    functions:
    - name: getProviderProfile
      operation: service:java:io.rhdhorchestrator.workflow.providertoken.ProviderTokenConsumer::getGithubProfile
      type: custom
    start:
      stateName: GetProviderProfile
    states:
    - actionMode: sequential
      actions:
      - actionDataFilter:
          toStateData: .profile
          useResults: true
        functionRef:
          arguments:
            grantId: '${ .grantId // $WORKFLOW.headers."X-Provider-Token-Grant-Github" }'
            provider: '${ .provider // "github" }'
          invoke: sync
          refName: getProviderProfile
        name: callProvider
      end:
        terminate: true
      name: GetProviderProfile
      type: operation
  podTemplate:
    container:
      image: quay.io/orchestrator/demo-provider-token-grant:latest
      resources: {}
  resources:
    configMaps:
    - configMap:
        name: 01-provider-token-grant-resources-schemas
      workflowPath: schemas
status:
  address: {}
  lastTimeRecoverAttempt: null
