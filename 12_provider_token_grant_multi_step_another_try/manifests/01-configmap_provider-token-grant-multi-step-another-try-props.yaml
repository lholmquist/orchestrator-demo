apiVersion: v1
data:
  application.properties: |
    # The broker endpoint is the Backstage secure-token-storage service route.
    # Custom REST functions use separate protocol, host, and port values with the
    # relative endpoint declared in the workflow. Keep the service credential in
    # configuration; it is read through the workflow's $SECRET resolver and is
    # never supplied as workflow input.
    kogito.sw.functions.getProviderToken.protocol=${SECURE_TOKEN_STORAGE_PROTOCOL:http}
    kogito.sw.functions.getProviderToken.host=${SECURE_TOKEN_STORAGE_HOST:localhost}
    kogito.sw.functions.getProviderToken.port=${SECURE_TOKEN_STORAGE_PORT:7007}
    kogito.sw.functions.getGithubProfile.protocol=${GITHUB_API_PROTOCOL:https}
    kogito.sw.functions.getGithubProfile.host=${GITHUB_API_HOST:api.github.com}
    kogito.sw.functions.getGithubProfile.port=${GITHUB_API_PORT:443}
    kogito.sw.functions.getGithubPrivateRepositories.protocol=${GITHUB_API_PROTOCOL:https}
    kogito.sw.functions.getGithubPrivateRepositories.host=${GITHUB_API_HOST:api.github.com}
    kogito.sw.functions.getGithubPrivateRepositories.port=${GITHUB_API_PORT:443}
    kogito.sw.functions.getGithubOrganizations.protocol=${GITHUB_API_PROTOCOL:https}
    kogito.sw.functions.getGithubOrganizations.host=${GITHUB_API_HOST:api.github.com}
    kogito.sw.functions.getGithubOrganizations.port=${GITHUB_API_PORT:443}
    kogito.sw.functions.getGithubStarredRepositories.protocol=${GITHUB_API_PROTOCOL:https}
    kogito.sw.functions.getGithubStarredRepositories.host=${GITHUB_API_HOST:api.github.com}
    kogito.sw.functions.getGithubStarredRepositories.port=${GITHUB_API_PORT:443}
    secure_token_storage_service_token=${SECURE_TOKEN_STORAGE_SERVICE_TOKEN:}
    github_api_version=${GITHUB_API_VERSION:2022-11-28}
    # This standalone workflow does not provide a local Data Index service.
    quarkus.kogito.devservices.enabled=false
    # Keep HTTP client logging disabled: provider access tokens must never enter logs.
    quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=OFF
    # Do not start or expose the PGAdmin UI.
    quarkus.pgadmin-ui.enabled=false
kind: ConfigMap
metadata:
  creationTimestamp: null
  labels:
    app: provider-token-grant-multi-step-another-try
    app.kubernetes.io/component: serverless-workflow
    app.kubernetes.io/instance: provider-token-grant-multi-step-another-try
    app.kubernetes.io/managed-by: sonataflow-operator
    app.kubernetes.io/name: provider-token-grant-multi-step-another-try
    app.kubernetes.io/version: main
    sonataflow.org/workflow-app: provider-token-grant-multi-step-another-try
    sonataflow.org/workflow-namespace: ""
  name: provider-token-grant-multi-step-another-try-props
